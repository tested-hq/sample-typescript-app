name: tested-diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage-diff:
    name: tested check against base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          standalone: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: vitest with coverage
        run: pnpm test:coverage

      # Gate (tested check) then ingest. junit.xml is written by Vitest
      # (reporters + outputFile in vitest.config.ts) so push includes
      # flakes / suite time, not coverage-only.
      - uses: tested-hq/cli/action@main
        with:
          version: 0.1.7
          push: true
          pr-number: ${{ github.event.pull_request.number }}
          token: ${{ secrets.TESTED_TOKEN }}
          junit: junit.xml
